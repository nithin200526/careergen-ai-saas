version: '3.8'

services:
  # Node.js API
  api:
    build: .
    container_name: resume-ai-api
    restart: unless-stopped
    ports:
      - '${PORT:-5000}:5000'
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/resume-ai-saas
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  # MongoDB
  mongo:
    image: mongo:7
    container_name: resume-ai-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge
